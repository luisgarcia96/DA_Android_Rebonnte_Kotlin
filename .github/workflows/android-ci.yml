name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-validation:
    name: Android validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Verify SonarQube Cloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Missing SONAR_TOKEN repository secret."; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Missing SONAR_ORGANIZATION repository secret."; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Missing SONAR_PROJECT_KEY repository secret."; exit 1; }

      - name: Validate Android code
        run: ./gradlew lintDebug assembleDebug :app:createDebugUnitTestCoverageReport --no-daemon --stacktrace

      - name: Verify coverage report
        run: test -s app/build/reports/coverage/test/debug/report.xml

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

  firebase-app-distribution:
    name: Firebase App Distribution
    needs: android-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::Missing GOOGLE_SERVICES_JSON repository secret."; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Restore release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rebonnte-release.jks"
          printf '%s\n' "REBONNTE_RELEASE_STORE_FILE=$RUNNER_TEMP/rebonnte-release.jks" >> "$HOME/.gradle/gradle.properties"
          printf '%s\n' "REBONNTE_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$HOME/.gradle/gradle.properties"
          printf '%s\n' "REBONNTE_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$HOME/.gradle/gradle.properties"
          printf '%s\n' "REBONNTE_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$HOME/.gradle/gradle.properties"
          printf '%s\n' "REBONNTE_RELEASE_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$HOME/.gradle/gradle.properties"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute release to Firebase
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_REBONNTE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REBONNTE }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$FIREBASE_APP_ID" || { echo "::error::Missing FIREBASE_APP_ID repository variable."; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_REBONNTE" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_REBONNTE repository secret."; exit 1; }
          test -n "$FIREBASE_TESTER_GROUPS" || { echo "::error::Missing FIREBASE_TESTER_GROUPS repository variable."; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_REBONNTE" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Release ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/rebonnte-release.jks" "$RUNNER_TEMP/firebase-service-account.json"
