sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
sonar.java.binaries=app/build/tmp/kotlin-classes/debug
sonar.java.test.binaries=app/build/tmp/kotlin-classes/debugUnitTest
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml
# Compose UI, Android lifecycle code and Firebase-backed orchestration are covered by
# instrumented tests; the unit-test report measures deterministic business rules only.
sonar.coverage.exclusions=**/MainActivity.kt,**/*Activity.kt,**/*Screen.kt,**/ui/components/**,**/ui/theme/**,**/*ViewModel.kt
sonar.sourceEncoding=UTF-8
